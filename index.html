<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apollo Archive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="focus-state">
    
    <div id="passcode-overlay">
        <div class="passcode-box">
            <img src="logo.png" style="width: 180px; margin-bottom: 25px; display: block; margin-left: auto; margin-right: auto;">
            <div style="font-size: 12px; margin-bottom: 12px; font-weight: bold; text-transform: lowercase;">enter archive code</div>
            <input type="password" id="passcode-input" onkeyup="checkPasscode(event)" autocomplete="off">
        </div>
    </div>

    <header id="main-header">
        <div class="header-columns">
            
            <div class="header-col left-col">
                <div class="title-wrapper">
                    <div class="big-header-title">APOLLO <span class="menu-toggle" onclick="toggleMenu('apollo', event)">+</span></div>
                    <div class="dropdown-menu" id="menu-apollo">
                        <a href="https://www.instagram.com/apollo.review" target="_blank" class="highlight-link">instagram</a>
                        <a href="https://pin.it/6n3uztWHe" target="_blank" class="highlight-link">pinterest</a>
                        <a href="#" class="highlight-link">contact</a>
                        <a href="https://tally.so/r/81P1XY" target="_blank" class="highlight-link">join apollo</a>
                    </div>
                </div>
            </div>

            <div class="header-col center-col">
                <div class="center-col-flex">
                    <div class="title-wrapper" style="justify-content: center;">
                        <div class="big-header-title archive-title">ARCHIVE</div>
                        <span class="menu-toggle archive-toggle" onclick="toggleMenu('archive', event)">+</span>
                        <div class="dropdown-menu archive-menu" id="menu-archive">
                            <a href="https://tally.so/r/LZJPYv" target="_blank" class="highlight-link">submit</a>
                        </div>
                    </div>
                    <nav id="filter-bar"></nav>
                </div>
            </div>

            <div class="header-col right-col">
                <div class="title-wrapper" style="justify-content: flex-end; width: 100%;">
                    <div class="big-header-title">MAGAZINE <span class="menu-toggle" onclick="toggleMenu('magazine', event)">+</span></div>
                    <div class="dropdown-menu left-aligned" id="menu-magazine">
                        <a href="https://tally.so/r/lb7BOX" target="_blank" class="highlight-link">submit</a>
                    </div>
                </div>
            </div>

        </div>
    </header>

    <main id="archive-stage">
        <div id="dashboard-wrapper">
            <div id="calendar-column" class="side-column"><div id="calendar-content"></div></div>
            <div id="project-pile"></div>
            <div id="magazine-column" class="side-column"><div id="magazine-cover-container" onclick="openMagazine()"></div></div>
        </div>
    </main>

    <footer id="main-footer">
        <div class="manifesto-line">
            the platform to showcase polimi students work and connect with the global architecture community through projects, photography and visual storytelling
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
