name: Sync Audio Assets

on:
  push:
    paths:
      - 'data.json'
  workflow_dispatch:

jobs:
  download-audio:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Download Audio Files
        run: node .github/scripts/download_audio.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/audio/ data.json || true
          git commit -m "Auto-downloaded MP3 files from Google Drive" || echo "No new audio files to commit"
          git push
